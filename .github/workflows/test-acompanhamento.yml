name: Validar Acompanhamento de Performance
on:
  push:
    branches: [main]
    paths:
      - 'planejamento2027.js'
      - 'planejamento2027.css'
      - 'filtros-unificados.css'
      - 'index.html'
      - 'scripts/test-planejamento2027.js'
      - 'ignis-multiselect.js'
      - 'scripts/test-filtros-multiselect.js'
      - 'scripts/test-dashboard-intacto.js'
      - '.github/workflows/test-acompanhamento.yml'
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'scripts/test-firebase-sync.js'
      - 'scripts/test-planejamento2027.js'
      - 'planejamento2027.js'
      - 'planejamento2027.css'
      - 'filtros-unificados.css'
      - 'ignis-multiselect.js'
      - 'scripts/test-filtros-multiselect.js'
      - 'scripts/test-dashboard-intacto.js'
      - '.github/workflows/test-acompanhamento.yml'
  workflow_dispatch:
jobs:
  validar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verificar sintaxe do módulo
        run: node --check planejamento2027.js
      - name: Executar testes funcionais sem dados reais
        run: node scripts/test-planejamento2027.js
      - name: Validar leitura e segurança do Firebase
        run: node scripts/test-firebase-sync.js
      - name: Confirmar que o Dashboard não sofreu alterações
        run: node scripts/test-dashboard-intacto.js
      - name: Validar seleção múltipla do Acompanhamento
        run: node scripts/test-filtros-multiselect.js
      - name: Validar ordem de eficiência e BI de frota leve
        run: node scripts/test-relatorio-eficiencia.js
