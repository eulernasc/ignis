name: Relatório Mensal de Eficiência

on:
  workflow_dispatch: # Arquivado: o envio oficial ocorre manualmente no IGNIS.

jobs:
  enviar-relatorio:
    if: ${{ false }} # Rotina legada desativada; preservada apenas para histórico.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: scripts

    steps:
      - name: Checkout repositório
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Instalar dependências
        run: npm install

      - name: Rodar relatório e enviar e-mails
        env:
          IGNIS_REPORT_EMAIL: ignis-report-reader@ignis.invalid
          IGNIS_REPORT_PASSWORD: ${{ secrets.IGNIS_REPORT_PASSWORD }}
          FIREBASE_API_KEY: AIzaSyBdfrSrrf-vThP3WqWJF76hhKE7FXGFpL0
          FIREBASE_PROJECT_ID: fueltracker-adee5
          OUTLOOK_USER: ${{ secrets.OUTLOOK_USER }}
          OUTLOOK_PASS: ${{ secrets.OUTLOOK_PASS }}
        run: node relatorio.js
